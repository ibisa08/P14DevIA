name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python 3.13 est installé par uv d'après backend/.python-version.
      # --frozen : échoue si uv.lock n'est pas à jour avec pyproject.toml.
      - name: Installer les dépendances
        run: uv sync --frozen

      # Les tests tournent sur SQLite en mémoire : pas de service Postgres nécessaire
      - name: Lancer pytest
        run: uv run pytest -v
