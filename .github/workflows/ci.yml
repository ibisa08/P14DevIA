name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    # uv installe par liens durs depuis son cache (Linux) et LlamaIndex refuse de lire ses fichiers
    # de données multi-liens (« Security Violation », CWE-59) : le RAG passerait en repli et les
    # tests échoueraient. Les paquets sont donc copiés (voir docs/developpement.md).
    env:
      UV_LINK_MODE: copy
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python 3.13 est installé par uv d'après backend/.python-version.
      # --frozen : échoue si uv.lock n'est pas à jour avec pyproject.toml.
      - name: Installer les dépendances
        run: uv sync --frozen

      # Les tests tournent sur SQLite en mémoire : pas de service Postgres nécessaire
      - name: Lancer pytest
        run: uv run pytest -v
