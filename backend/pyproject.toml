[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.3.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "pydantic-ai-slim[anthropic]>=2.60.0",
]

[tool.pytest.ini_options]
# Le code utilise des imports plats (`from models import User`) : src/ doit être sur le sys.path.
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
